  telefono: "876 54 21 30"
  email: hola@solaria-aragon.es
  direccion: Polígono Malpica, calle D 12, 50016 Zaragoza
  horario: "Lunes a viernes, de 8:00 a 18:00."
  whatsapp: "+34 611 54 21 30"
redes:
  instagram: https://www.instagram.com/
  facebook: ""
