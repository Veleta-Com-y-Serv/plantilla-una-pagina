  ventajas:
    activa: true
    antetitulo: Por qué Solaria
    titulo: Sin letra pequeña. Sin sorpresas.
    items:
      - { titulo: Estudio gratis en 48 horas, texto: "Miramos tu tejado por satélite y tu factura. Te damos un presupuesto cerrado con el ahorro real.", icono: sol }
      - { titulo: Ayudas tramitadas, texto: "Nos ocupamos de la bonificación del IBI y las subvenciones.", icono: euro }
