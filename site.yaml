boton_cabecera: { texto: Pide presupuesto, url: "/#contacto" }
seo:
  titulo: Solaria Aragón · Placas solares en Zaragoza
  descripcion: "Instalamos placas solares en viviendas, comunidades y naves de Zaragoza. Estudio gratis, subvenciones tramitadas y garantía de 25 años."
  tipo: LocalBusiness
marca_pie: true

secciones:
  hero:
    activa: true
    antetitulo: Energía solar en Zaragoza
    titulo: Tu tejado ya paga
    titulo_destacado: tu factura de luz.   # parte del titular en degradado
    texto: "Estudiamos tu consumo, instalamos y tramitamos las ayudas. Tú solo ves bajar la factura."
    imagen: /fotos/hero.jpg
    cta: { texto: Calcula tu ahorro, url: "/#contacto" }
    cta_secundario: { texto: Cómo trabajamos, url: "/#servicios" }
    items:
      - { titulo: "−60 %", texto: en la factura de luz }
      - { titulo: "1.200", texto: instalaciones hechas }
      - { titulo: "25 años", texto: de garantía en paneles }

  ventajas:
    activa: true
    antetitulo: Por qué Solaria
    titulo: Sin letra pequeña. Sin sorpresas.
    items:
      - { titulo: Estudio gratis en 48 horas, texto: "Miramos tu tejado por satélite y tu factura. Te damos un presupuesto cerrado con el ahorro real.", icono: sol }
      - { titulo: Ayudas tramitadas, texto: "Nos ocupamos de la bonificación del IBI y las subvenciones.", icono: euro }
      - { titulo: Instalación en un día, texto: "Equipo propio. Sin subcontratas.", icono: rayo }
      - { titulo: App de seguimiento, texto: "Ves en el móvil cuánto produces y cuánto ahorras.", icono: grafico }
      - { titulo: Mantenimiento incluido, texto: "Revisión anual el primer lustro.", icono: herramienta }

  servicios:
    activa: true
    antetitulo: Servicios
    titulo: Lo que instalamos
    texto: "Para casas, comunidades de vecinos y empresas."
    items:
      - { titulo: Autoconsumo para viviendas, texto: "De 6 a 12 paneles, con o sin batería. Compensación de excedentes." }
      - { titulo: Comunidades de vecinos, texto: "Autoconsumo compartido: cada vecino ahorra según su cuota." }
      - { titulo: Naves e industria, texto: "Instalaciones de 20 a 500 kW con estudio de amortización." }
      - { titulo: Baterías y cargadores, texto: "Guarda la energía para la noche y carga tu coche eléctrico." }

  cta:
    activa: true
    titulo: ¿Cuánto ahorrarías tú?
    texto: "Mándanos una foto de tu factura y te lo decimos en 48 horas. Gratis."
    cta: { texto: Quiero saberlo, url: "/#contacto" }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Lo que todo el mundo pregunta
    preguntas:
      - { pregunta: "¿Cuánto se tarda en tener las placas funcionando?", respuesta: "El estudio está en 48 horas y la instalación se hace en un día en la mayoría de viviendas. Los permisos los tramitamos nosotros." }
      - { pregunta: "¿Quién se encarga de las ayudas?", respuesta: "Nosotros. Te decimos a qué ayudas puedes optar, como la bonificación del IBI de tu ayuntamiento, y presentamos los papeles por ti." }
      - { pregunta: "¿Necesito batería?", respuesta: "No es obligatoria. Compensa si gastas sobre todo por la tarde y la noche; si no, suele bastar con la compensación de excedentes. Te lo decimos en el estudio." }
      - { pregunta: "¿Y si mi tejado no da al sur?", respuesta: "También se puede. Con orientación este u oeste se produce algo menos, pero sigue saliendo a cuenta. Lo vemos en el estudio por satélite." }
      - { pregunta: "¿Qué mantenimiento necesitan?", respuesta: "Muy poco: una limpieza de vez en cuando y una revisión al año, que va incluida los cinco primeros años." }

  contacto:
    activa: true
    antetitulo: Contacto
    titulo: Hablemos de tu tejado
    texto: "Déjanos tus datos y te llamamos. O escríbenos directamente."
